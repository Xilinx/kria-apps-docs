<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" font-family="Helvetica,Arial,sans-serif">
  <!-- Copyright (C) 2026 Advanced Micro Devices, Inc. All rights reserved. -->
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="638" height="278" fill="#ffffff" stroke="#e0e0e0"/>
  <!-- Publishers -->
  <rect x="30" y="40" width="140" height="45" rx="6" fill="#e8f0fe" stroke="#1f4e78" stroke-width="2"/>
  <text x="100" y="68" text-anchor="middle" font-size="13" fill="#1f4e78" font-weight="bold">Publisher A</text>
  <rect x="30" y="190" width="140" height="45" rx="6" fill="#e8f0fe" stroke="#1f4e78" stroke-width="2"/>
  <text x="100" y="218" text-anchor="middle" font-size="13" fill="#1f4e78" font-weight="bold">Publisher B</text>
  <!-- Topic bus -->
  <rect x="260" y="115" width="120" height="50" rx="24" fill="#fff4e5" stroke="#b06a00" stroke-width="2"/>
  <text x="320" y="145" text-anchor="middle" font-size="15" fill="#b06a00" font-weight="bold">Topic</text>
  <!-- Subscribers -->
  <rect x="470" y="40" width="140" height="45" rx="6" fill="#e8f0fe" stroke="#1f4e78" stroke-width="2"/>
  <text x="540" y="68" text-anchor="middle" font-size="13" fill="#1f4e78" font-weight="bold">Subscriber X</text>
  <rect x="470" y="190" width="140" height="45" rx="6" fill="#e8f0fe" stroke="#1f4e78" stroke-width="2"/>
  <text x="540" y="218" text-anchor="middle" font-size="13" fill="#1f4e78" font-weight="bold">Subscriber Y</text>
  <!-- publish arrows -->
  <line x1="170" y1="62" x2="262" y2="128" stroke="#333" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="170" y1="212" x2="262" y2="152" stroke="#333" stroke-width="2" marker-end="url(#arrow2)"/>
  <!-- subscribe arrows -->
  <line x1="380" y1="128" x2="468" y2="62" stroke="#333" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="380" y1="152" x2="468" y2="212" stroke="#333" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="320" y="255" text-anchor="middle" font-size="12" fill="#888">Multiple publishers and subscribers exchanging messages on a topic</text>
</svg>
