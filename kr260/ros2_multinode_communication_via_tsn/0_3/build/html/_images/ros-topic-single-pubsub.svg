<svg xmlns="http://www.w3.org/2000/svg" width="640" height="180" viewBox="0 0 640 180" font-family="Helvetica,Arial,sans-serif">
  <!-- Copyright (C) 2026 Advanced Micro Devices, Inc. All rights reserved. -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="638" height="178" fill="#ffffff" stroke="#e0e0e0"/>
  <!-- Publisher node -->
  <rect x="30" y="60" width="150" height="60" rx="6" fill="#e8f0fe" stroke="#1f4e78" stroke-width="2"/>
  <text x="105" y="86" text-anchor="middle" font-size="15" fill="#1f4e78" font-weight="bold">Publisher</text>
  <text x="105" y="106" text-anchor="middle" font-size="12" fill="#444">Node</text>
  <!-- Topic bus -->
  <rect x="255" y="70" width="130" height="40" rx="20" fill="#fff4e5" stroke="#b06a00" stroke-width="2"/>
  <text x="320" y="95" text-anchor="middle" font-size="14" fill="#b06a00" font-weight="bold">Topic</text>
  <!-- Subscriber node -->
  <rect x="460" y="60" width="150" height="60" rx="6" fill="#e8f0fe" stroke="#1f4e78" stroke-width="2"/>
  <text x="535" y="86" text-anchor="middle" font-size="15" fill="#1f4e78" font-weight="bold">Subscriber</text>
  <text x="535" y="106" text-anchor="middle" font-size="12" fill="#444">Node</text>
  <!-- arrows -->
  <line x1="180" y1="90" x2="250" y2="90" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="385" y1="90" x2="455" y2="90" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="215" y="80" text-anchor="middle" font-size="11" fill="#666">publish</text>
  <text x="420" y="80" text-anchor="middle" font-size="11" fill="#666">subscribe</text>
  <text x="320" y="150" text-anchor="middle" font-size="12" fill="#888">Single publisher and single subscriber on a topic</text>
</svg>
